services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  postgres:
    image: pgvector/pgvector:pg17
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_rag}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_rag_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge_rag} -d ${POSTGRES_DB:-knowledge_rag}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management
    profiles: ["cap"]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-knowledge_rag}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-knowledge_rag_dev_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: quay.io/minio/minio:latest
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: ["otel"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  app:
    build:
      context: .
      dockerfile: src/KnowledgeRag.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:8080
      AI__BASEURL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI__APIKEY: ${AI_API_KEY:-}
      AI__CHATMODEL: ${AI_CHAT_MODEL:-gpt-4o-mini}
      AI__EMBEDDINGMODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI__EMBEDDINGDIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1536}
      AI__SENDEMBEDDINGDIMENSIONS: ${AI_SEND_EMBEDDING_DIMENSIONS:-false}
      SECRETPROTECTION__MASTERKEY: ${SECRET_PROTECTION_MASTER_KEY:-}
      SECRETPROTECTION__PREVIOUSMASTERKEYS__0: ${SECRET_PROTECTION_PREVIOUS_MASTER_KEY_1:-}
      SECRETPROTECTION__PREVIOUSMASTERKEYS__1: ${SECRET_PROTECTION_PREVIOUS_MASTER_KEY_2:-}
      SECRETPROTECTION__LEGACYAUTHSIGNINGKEYS__0: ${SECRET_PROTECTION_LEGACY_AUTH_SIGNING_KEY_1:-}
      SECRETPROTECTION__LEGACYAUTHSIGNINGKEYS__1: ${SECRET_PROTECTION_LEGACY_AUTH_SIGNING_KEY_2:-}
      QDRANT__ENDPOINT: http://qdrant:6333
      QDRANT__COLLECTION: ${QDRANT_COLLECTION:-knowledge_chunks}
      DATABASE__PROVIDER: ${DATABASE_PROVIDER:-Sqlite}
      DATABASE__CONNECTIONSTRING: ${DATABASE_CONNECTION_STRING:-Data Source=/app/App_Data/knowledge.db}
      DATABASE__AUTOMIGRATE: ${DATABASE_AUTO_MIGRATE:-true}
      CAP__TRANSPORT: ${CAP_TRANSPORT:-inmemory}
      CAP__FAILEDRETRYCOUNT: ${CAP_FAILED_RETRY_COUNT:-20}
      CAP__RABBITMQ__HOSTNAME: ${RABBITMQ_HOST:-rabbitmq}
      CAP__RABBITMQ__PORT: ${RABBITMQ_PORT:-5672}
      CAP__RABBITMQ__USERNAME: ${RABBITMQ_USER:-knowledge_rag}
      CAP__RABBITMQ__PASSWORD: ${RABBITMQ_PASSWORD:-knowledge_rag_dev_password}
      CAP__RABBITMQ__VIRTUALHOST: ${RABBITMQ_VHOST:-/}
      CAP__RABBITMQ__EXCHANGENAME: ${CAP_EXCHANGE:-knowledge-rag.cap}
      SEARCHBACKEND__VECTOR: ${SEARCH_VECTOR_BACKEND:-qdrant}
      SEARCHBACKEND__LEXICAL: ${SEARCH_LEXICAL_BACKEND:-bm25}
      SEARCHBACKEND__POSTGRESFTSCONFIGURATION: ${POSTGRES_FTS_CONFIG:-simple}
      RAG__TOPK: ${RAG_TOP_K:-5}
      RAG__CANDIDATECOUNT: ${RAG_CANDIDATE_COUNT:-30}
      RAG__CHUNKSIZE: ${RAG_CHUNK_SIZE:-1200}
      RAG__CHUNKOVERLAP: ${RAG_CHUNK_OVERLAP:-200}
      RAG__MAXUPLOADMEGABYTES: ${RAG_MAX_UPLOAD_MEGABYTES:-30}
      RAG__MAXEXTRACTEDCHARACTERS: ${RAG_MAX_EXTRACTED_CHARACTERS:-2000000}
      RAG__MAXPDFPAGES: ${RAG_MAX_PDF_PAGES:-1000}
      RATELIMITING__PERMITLIMIT: ${RATE_LIMITING_PERMIT_LIMIT:-120}
      RATELIMITING__AUTHPERMITLIMIT: ${RATE_LIMITING_AUTH_PERMIT_LIMIT:-10}
      RATELIMITING__WINDOWSECONDS: ${RATE_LIMITING_WINDOW_SECONDS:-60}
      CORS__ALLOWEDORIGINS__0: ${CORS_ALLOWED_ORIGIN_1:-}
      CORS__ALLOWEDORIGINS__1: ${CORS_ALLOWED_ORIGIN_2:-}
      FORWARDEDHEADERS__KNOWNPROXIES__0: ${FORWARDED_HEADERS_KNOWN_PROXY_1:-}
      FORWARDEDHEADERS__KNOWNPROXIES__1: ${FORWARDED_HEADERS_KNOWN_PROXY_2:-}
      SECURITY__ENFORCEHTTPSREDIRECTION: ${SECURITY_ENFORCE_HTTPS_REDIRECTION:-false}
      SECURITY__HSTSMAXAGEDAYS: ${SECURITY_HSTS_MAX_AGE_DAYS:-180}
      SECURITY__HSTSINCLUDESUBDOMAINS: ${SECURITY_HSTS_INCLUDE_SUBDOMAINS:-false}
      RERANKER__MODE: ${RERANKER_MODE:-local}
      RERANKER__MODEL: ${RERANKER_MODEL:-}
      AUTH__ISSUER: ${AUTH_ISSUER:-KnowledgeRag}
      AUTH__AUDIENCE: ${AUTH_AUDIENCE:-KnowledgeRag.Client}
      AUTH__SIGNINGKEY: ${AUTH_SIGNING_KEY:-please-change-this-to-a-long-random-secret-at-least-32-characters}
      AUTH__ACCESSTOKENMINUTES: ${AUTH_ACCESS_TOKEN_MINUTES:-60}
      AUTH__REFRESHTOKENDAYS: ${AUTH_REFRESH_TOKEN_DAYS:-30}
      AUTH__ALLOWREGISTRATION: ${AUTH_ALLOW_REGISTRATION:-true}
      STORAGE__PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE__ROOTPATH: /app/App_Data/files
      S3__ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3__REGION: ${S3_REGION:-us-east-1}
      S3__BUCKET: ${S3_BUCKET:-knowledge-rag}
      S3__ACCESSKEY: ${S3_ACCESS_KEY:-minioadmin}
      S3__SECRETKEY: ${S3_SECRET_KEY:-minioadmin}
      S3__FORCEPATHSTYLE: ${S3_FORCE_PATH_STYLE:-true}
      OPENTELEMETRY__ENABLED: ${OTEL_ENABLED:-true}
      OPENTELEMETRY__SERVICENAME: ${OTEL_SERVICE_NAME:-KnowledgeRag.NonAzure}
      OPENTELEMETRY__OTLPENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OPENTELEMETRY__CONSOLEEXPORTER: ${OTEL_CONSOLE_EXPORTER:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - app-data:/app/App_Data

volumes:
  qdrant-data:
  postgres-data:
  rabbitmq-data:
  minio-data:
  app-data:

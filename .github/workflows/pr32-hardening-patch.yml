name: pr32-hardening-patch

on:
  push:
    branches:
      - feat/tenant-ai-embedding-index-generations

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tenant-ai-embedding-index-generations
      - name: Scope changelog edits to first current section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/pr32-hardening.py')
          s = p.read_text()
          s = s.replace('changelog = replace_once(changelog, "### Added\\n\\n", "### Added\\n\\n" + added, "changelog Added")', 'changelog = changelog.replace("### Added\\n\\n", "### Added\\n\\n" + added, 1)')
          s = s.replace('changelog = replace_once(changelog, "### Changed\\n\\n", "### Changed\\n\\n" + changed, "changelog Changed")', 'changelog = changelog.replace("### Changed\\n\\n", "### Changed\\n\\n" + changed, 1)')
          s = s.replace('changelog = replace_once(changelog, "### Fixed\\n\\n", "### Fixed\\n\\n" + fixed, "changelog Fixed")', 'changelog = changelog.replace("### Fixed\\n\\n", "### Fixed\\n\\n" + fixed, 1)')
          p.write_text(s)
          PY
      - name: Apply hardening patch
        run: python3 scripts/pr32-hardening.py
      - name: Verify patch
        run: |
          test "$(grep -c '^## Unreleased$' CHANGELOG.md)" -eq 1
          grep -q 'activeGenerationGuard' src/KnowledgeRag.Infrastructure/Documents/KnowledgeIngestionService.cs
          grep -q 'firstGenerationVector = new float\[3\]' tests/KnowledgeRag.Api.IntegrationTests/ExternalBackendTests.cs
      - name: Remove temporary files and commit
        run: |
          rm .github/workflows/pr32-hardening-patch.yml scripts/pr32-hardening.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md src/KnowledgeRag.Infrastructure/Documents/KnowledgeIngestionService.cs tests/KnowledgeRag.Api.IntegrationTests/ExternalBackendTests.cs .github/workflows/pr32-hardening-patch.yml scripts/pr32-hardening.py
          git commit -m 'fix(index): harden active generation concurrency'
          git push origin HEAD:feat/tenant-ai-embedding-index-generations

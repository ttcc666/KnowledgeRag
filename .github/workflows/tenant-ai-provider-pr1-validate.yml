name: Tenant AI Provider PR1 Validate

on:
  push:
    branches:
      - feat/tenant-ai-provider-foundation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/KnowledgeRag.Admin/package-lock.json

      - name: Update Unreleased changelog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          marker = '- 新增 **Tenant AI Provider Control Plane**'
          if marker not in text:
              anchor = '## Unreleased\n\n### Added\n\n'
              entry = (
                  '- 新增 **Tenant AI Provider Control Plane**：租户可管理 OpenAI-compatible Provider Connection、加密 Credential、Chat / Embedding / Rerank Model Deployment 与租户默认模型；Chat/Planner/Answer/Reviewer 运行时按租户解析 Provider，未配置租户 Provider 时保持平台级 AI fallback。\n'
                  '- 新增租户 AI Provider 管理界面与连接验证；Embedding Deployment 本阶段仅作为后续版本化 Reindex 的目标配置，现有 active vector space 不会因租户默认值变化而直接切换。\n'
              )
              if anchor not in text:
                  raise SystemExit('Unreleased Added anchor not found')
              text = text.replace(anchor, anchor + entry, 1)
          security_anchor = '### Fixed\n\n'
          security_marker = '- Tenant-managed AI Provider Base URL'
          if security_marker not in text:
              security = '- Tenant-managed AI Provider Base URL 强制使用公网 HTTPS，并复用无 ambient proxy、无 redirect、DNS 公网地址校验与 ConnectCallback pinning 的 SSRF 安全连接策略；Provider Credential 使用独立 purpose 的 AES-GCM 加密且 API 永不返回明文。\n'
              changed_anchor = '### Changed\n\n'
              if changed_anchor not in text:
                  raise SystemExit('Unreleased Changed anchor not found')
              text = text.replace(changed_anchor, changed_anchor + security, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Frontend install
        working-directory: src/KnowledgeRag.Admin
        run: npm ci

      - name: Frontend build
        working-directory: src/KnowledgeRag.Admin
        run: npm run build

      - name: Frontend tests
        working-directory: src/KnowledgeRag.Admin
        run: npm test -- --run

      - name: .NET restore
        run: dotnet restore KnowledgeRag.NonAzure.sln

      - name: .NET build
        run: dotnet build KnowledgeRag.NonAzure.sln -c Release --no-restore

      - name: .NET tests
        run: dotnet test KnowledgeRag.NonAzure.sln -c Release --no-build

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(ai): record tenant provider control plane"
          git push origin HEAD:feat/tenant-ai-provider-foundation

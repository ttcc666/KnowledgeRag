name: patch-governance-sqlite

on:
  push:
    branches:
      - feat/platform-governance-suite
    paths:
      - .github/workflows/patch-governance-sqlite.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-governance-suite
      - name: Patch provider-neutral governance queries
        run: python3 .github/scripts/patch_governance_sqlite.py
      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/KnowledgeRag.Infrastructure/Governance src/KnowledgeRag.Infrastructure/Conversations/ConversationService.cs
          git commit -m "fix(governance): keep SQLite and PostgreSQL query behavior aligned"
          git push origin HEAD:feat/platform-governance-suite

name: update-assistant-ui-lock

on:
  push:
    branches:
      - feat/chat-agent-progress-assistant-ui

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chat-agent-progress-assistant-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/KnowledgeRag.Admin/package-lock.json
      - name: Refresh frontend lockfile
        working-directory: src/KnowledgeRag.Admin
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- src/KnowledgeRag.Admin/package-lock.json; then
            echo 'Lockfile already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KnowledgeRag.Admin/package-lock.json
          git commit -m 'chore(ui): lock assistant-ui dependencies'
          git push origin HEAD:feat/chat-agent-progress-assistant-ui

name: fix-chat-official-adapter

on:
  push:
    branches:
      - refactor/chat-official-assistant-ui-elements
    paths:
      - .github/workflows/fix-chat-official-adapter.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/chat-official-assistant-ui-elements
      - name: Fix KnowledgeRag adapter only
        run: |
          python3 -c 'from pathlib import Path; import re; p=Path("src/KnowledgeRag.Admin/src/features/chat/chat-page.tsx"); t=p.read_text(); t=t.replace("{event.tool || event.type}", "{event.label || event.type}"); t=re.sub(r"\n  const onSource = \(source: ChatSource\) => \{.*?\n  \}\n", "\n", t, count=1, flags=re.S); p.write_text(t)'
          rm -f .github/workflows/fix-chat-official-adapter.yml
      - name: Commit adapter fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(chat): align official elements with app primitives"
          git push origin HEAD:refactor/chat-official-assistant-ui-elements

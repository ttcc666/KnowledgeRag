name: fix-chat-official-adapter

on:
  push:
    branches:
      - refactor/chat-official-assistant-ui-elements
    paths:
      - .github/workflows/fix-chat-official-adapter.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/chat-official-assistant-ui-elements
      - name: Fix KnowledgeRag adapter only
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/KnowledgeRag.Admin/src/features/chat/chat-page.tsx')
          text = p.read_text()
          text = text.replace("        <span className='min-w-0 flex-1 truncate'>{event.tool || event.type}</span>", "        <span className='min-w-0 flex-1 truncate'>{event.label || event.type}</span>")
          dead = """  const onSource = (source: ChatSource) => {
    setSelectedSource(source)
    if (window.innerWidth < 1024) setMobileSource(true)
    else setSourcePanel(true)
  }

"""
          text = text.replace(dead, '')
          p.write_text(text)
          PY
          rm -f .github/workflows/fix-chat-official-adapter.yml
      - name: Commit adapter fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(chat): align official elements with app primitives"
          git push origin HEAD:refactor/chat-official-assistant-ui-elements

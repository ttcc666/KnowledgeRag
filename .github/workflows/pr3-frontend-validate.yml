name: pr3-frontend-validate

on:
  push:
    branches:
      - feat/ai-provider-routing-governance

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-provider-routing-governance
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/KnowledgeRag.Admin/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply frontend governance patch
        run: python3 scripts/pr3-frontend-governance.py
      - name: Install frontend dependencies
        working-directory: src/KnowledgeRag.Admin
        run: npm ci
      - name: Frontend build
        working-directory: src/KnowledgeRag.Admin
        run: npm run build
      - name: Frontend unit tests
        working-directory: src/KnowledgeRag.Admin
        run: npm test
      - name: Install Playwright Chromium
        working-directory: src/KnowledgeRag.Admin
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        working-directory: src/KnowledgeRag.Admin
        run: npm run test:e2e
      - name: Restore backend
        run: dotnet restore KnowledgeRag.NonAzure.sln
      - name: Backend build
        run: dotnet build KnowledgeRag.NonAzure.sln -c Release --no-restore
      - name: Backend tests
        run: dotnet test KnowledgeRag.NonAzure.sln -c Release --no-build
      - name: Remove temporary files and commit
        run: |
          rm .github/workflows/pr3-frontend-validate.yml scripts/pr3-frontend-governance.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src docs CHANGELOG.md .github/workflows/pr3-frontend-validate.yml scripts/pr3-frontend-governance.py
          git commit -m 'feat(ai): expose deployment routing governance UI'
          git push origin HEAD:feat/ai-provider-routing-governance

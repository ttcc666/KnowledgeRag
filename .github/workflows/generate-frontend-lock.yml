name: generate-frontend-lock

on:
  push:
    paths:
      - '.lock-trigger'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-maturity-p0-p1-p2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic npm lockfile
        working-directory: src/KnowledgeRag.Admin
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KnowledgeRag.Admin/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(ui): add frontend dependency lockfile'
          git push origin HEAD:feature/product-maturity-p0-p1-p2

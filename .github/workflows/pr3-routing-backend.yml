name: pr3-routing-backend

on:
  push:
    branches:
      - feat/ai-provider-routing-governance

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-provider-routing-governance
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply backend patch
        run: python3 scripts/pr3-routing-backend.py
      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.14
      - name: Restore
        run: dotnet restore KnowledgeRag.NonAzure.sln
      - name: Generate real EF migration
        env:
          Database__AutoMigrate: 'false'
        run: dotnet ef migrations add AiDeploymentRoutingGovernance --project src/KnowledgeRag.Infrastructure/KnowledgeRag.Infrastructure.csproj --startup-project src/KnowledgeRag.Api/KnowledgeRag.Api.csproj --context AppDbContext --output-dir Persistence/Migrations
      - name: Build
        run: dotnet build KnowledgeRag.NonAzure.sln -c Release --no-restore
      - name: Test
        run: dotnet test KnowledgeRag.NonAzure.sln -c Release --no-build
      - name: Remove temporary files and commit
        run: |
          rm .github/workflows/pr3-routing-backend.yml scripts/pr3-routing-backend.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md src tests .github/workflows/pr3-routing-backend.yml scripts/pr3-routing-backend.py
          git commit -m 'feat(ai): add deployment routing governance foundation'
          git push origin HEAD:feat/ai-provider-routing-governance

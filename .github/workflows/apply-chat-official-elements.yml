name: apply-chat-official-elements

on:
  push:
    branches:
      - refactor/chat-official-assistant-ui-elements
    paths:
      - .github/workflows/apply-chat-official-elements.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/chat-official-assistant-ui-elements
          fetch-depth: 0
      - name: Wire official assistant-ui Elements
        run: python3 .github/scripts/apply_chat_official.py
      - name: Remove temporary import workflows
        run: |
          rm -f .github/workflows/import-assistant-ui-elements.yml
          rm -f .github/workflows/apply-chat-official-elements.yml
          rm -f .github/scripts/apply_chat_official.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(chat): adopt official assistant-ui elements"
          git push origin HEAD:refactor/chat-official-assistant-ui-elements

name: chat-visual-hierarchy-patch
on:
  push:
    branches:
      - fix/chat-workflow-sources-visual-hierarchy
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-workflow-sources-visual-hierarchy
      - name: Apply product patch
        run: python3 .github/scripts/apply_chat_visual_hierarchy_patch.py
      - name: Commit product changes
        run: |
          rm .github/scripts/apply_chat_visual_hierarchy_patch.py
          rm .github/workflows/chat-visual-hierarchy-patch.yml
          git config user.name "ttcc666"
          git config user.email "102845335+ttcc666@users.noreply.github.com"
          git add -A
          git commit -m "fix(chat): refine workflow and source hierarchy"
          git push origin HEAD:fix/chat-workflow-sources-visual-hierarchy

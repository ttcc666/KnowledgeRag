name: fix-chat-workspace-polish-e2e

on:
  push:
    branches:
      - fix/chat-workspace-layout-polish

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-workspace-layout-polish
      - name: Patch browser assertions
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/KnowledgeRag.Admin/e2e/product-flows.spec.ts')
          text = path.read_text()
          details_old = "  await expect(page.getByText('问题分析完成')).toBeVisible()\n  await expect(page.getByText('检索、融合与重排完成')).toBeVisible()\n  await expect(page.getByText('证据审核通过')).toBeVisible()"
          details_new = "  const workflowDetails = page.getByTestId('run-status-details')\n  await expect(workflowDetails.getByText('问题分析完成', { exact: true })).toBeVisible()\n  await expect(workflowDetails.getByText('检索、融合与重排完成', { exact: true })).toBeVisible()\n  await expect(workflowDetails.getByText('证据审核通过', { exact: true })).toBeVisible()"
          if details_old not in text: raise SystemExit('workflow details browser block not found')
          text = text.replace(details_old, details_new)
          thread_old = "  await expect(page.getByRole('button', { name: 'Renamed policy', exact: true })).toBeVisible()\n\n  await page.getByRole('button', { name: 'More options' }).click()\n  const archiveRequest = page.waitForRequest((request) => request.url().endsWith('/api/conversations/c1/archive') && request.method() === 'POST')\n  await page.getByText('Archive', { exact: true }).click()"
          thread_new = "  const threadList = page.locator('[data-slot=\"aui_thread-list-root\"]')\n  const renamedThread = threadList.locator('[data-slot=\"aui_thread-list-item\"]').filter({ hasText: 'Renamed policy' })\n  await expect(renamedThread).toBeVisible()\n\n  await renamedThread.getByRole('button', { name: 'More options' }).click()\n  const archiveRequest = page.waitForRequest((request) => request.url().endsWith('/api/conversations/c1/archive') && request.method() === 'POST')\n  await page.getByRole('menuitem', { name: 'Archive', exact: true }).click()"
          if thread_old not in text: raise SystemExit('thread list browser block not found')
          text = text.replace(thread_old, thread_new, 1)
          path.write_text(text)
          Path('.github/workflows/fix-chat-polish-e2e.yml').unlink()
      - name: Commit browser test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(chat): scope workspace browser assertions"
          git push origin HEAD:fix/chat-workspace-layout-polish

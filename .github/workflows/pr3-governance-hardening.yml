name: pr3-governance-hardening

on:
  push:
    branches:
      - feat/ai-provider-routing-governance

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-provider-routing-governance
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply governance hardening
        run: python3 scripts/pr3-governance-hardening.py
      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.14
      - name: Restore
        run: dotnet restore KnowledgeRag.NonAzure.sln
      - name: Regenerate migration from hardened model
        env:
          Database__AutoMigrate: 'false'
        run: |
          dotnet ef migrations remove --force --project src/KnowledgeRag.Infrastructure/KnowledgeRag.Infrastructure.csproj --startup-project src/KnowledgeRag.Api/KnowledgeRag.Api.csproj --context AppDbContext
          dotnet ef migrations add AiDeploymentRoutingGovernance --project src/KnowledgeRag.Infrastructure/KnowledgeRag.Infrastructure.csproj --startup-project src/KnowledgeRag.Api/KnowledgeRag.Api.csproj --context AppDbContext --output-dir Persistence/Migrations
      - name: Normalize generated migration for SQLite and PostgreSQL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          migrations = sorted(Path('src/KnowledgeRag.Infrastructure/Persistence/Migrations').glob('*_AiDeploymentRoutingGovernance.cs'))
          if len(migrations) != 1:
              raise SystemExit(f'expected one routing migration, found {len(migrations)}')
          p = migrations[0]
          s = p.read_text(encoding='utf-8-sig')
          marker = '        protected override void Up(MigrationBuilder migrationBuilder)\n        {\n'
          if s.count(marker) != 1:
              raise SystemExit('migration Up marker mismatch')
          s = s.replace(marker, marker + '            var guidColumnType = ActiveProvider.Contains("Npgsql", StringComparison.Ordinal) ? "uuid" : "TEXT";\n\n', 1)
          # Every Guid added by this migration is a FK to a Guid principal and must match provider type.
          s = re.sub(r'(migrationBuilder\.AddColumn<Guid>\([\s\S]*?type: )"TEXT"(,[\s\S]*?\);)', r'\1guidColumnType\2', s)
          # Other generated SQLite affinity strings should delegate to the active provider.
          s = s.replace('type: "TEXT",\n                maxLength:', 'type: null,\n                maxLength:')
          s = s.replace('type: "TEXT",\n                nullable: true);', 'type: null,\n                nullable: true);')
          s = s.replace('defaultValue: "");', 'defaultValue: "unknown");')
          if 'AddColumn<Guid>' in s and 'type: "TEXT"' in ''.join(re.findall(r'migrationBuilder\.AddColumn<Guid>\([\s\S]*?\);', s)):
              raise SystemExit('provider-specific Guid TEXT remains')
          p.write_text(s)
          print(p)
          PY
      - name: Build
        run: dotnet build KnowledgeRag.NonAzure.sln -c Release --no-restore
      - name: Test
        run: dotnet test KnowledgeRag.NonAzure.sln -c Release --no-build
      - name: Remove temporary files and commit
        run: |
          rm .github/workflows/pr3-governance-hardening.yml scripts/pr3-governance-hardening.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests CHANGELOG.md .github/workflows/pr3-governance-hardening.yml scripts/pr3-governance-hardening.py
          git commit -m 'fix(ai): harden deployment identity governance'
          git push origin HEAD:feat/ai-provider-routing-governance

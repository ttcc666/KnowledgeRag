name: chat-visual-hierarchy-test-fix
on:
  push:
    branches:
      - fix/chat-workflow-sources-visual-hierarchy
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-workflow-sources-visual-hierarchy
      - name: Apply test fix
        run: python3 .github/scripts/fix_chat_visual_hierarchy_test.py
      - name: Commit test fix
        run: |
          rm .github/scripts/fix_chat_visual_hierarchy_test.py
          rm .github/workflows/chat-visual-hierarchy-test-fix.yml
          git config user.name "ttcc666"
          git config user.email "102845335+ttcc666@users.noreply.github.com"
          git add -A
          git commit -m "test(chat): stabilize source hierarchy assertion"
          git push origin HEAD:fix/chat-workflow-sources-visual-hierarchy

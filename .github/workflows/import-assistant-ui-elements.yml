name: import-assistant-ui-elements

on:
  push:
    branches:
      - refactor/chat-official-assistant-ui-elements
    paths:
      - .github/workflows/import-assistant-ui-elements.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/chat-official-assistant-ui-elements
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/KnowledgeRag.Admin/package-lock.json
      - name: Install official assistant-ui elements from registry
        working-directory: src/KnowledgeRag.Admin
        run: |
          npx shadcn@latest add https://r.assistant-ui.com/thread.json https://r.assistant-ui.com/thread-list.json --yes --overwrite
          npm install @assistant-ui/react@latest @assistant-ui/react-markdown@latest --save
      - name: Preserve existing shared UI primitives outside Chat
        run: |
          git checkout origin/main -- src/KnowledgeRag.Admin/src/components/ui/button.tsx || true
      - name: Commit official registry output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/KnowledgeRag.Admin
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(chat): import official assistant-ui elements"
          git push origin HEAD:refactor/chat-official-assistant-ui-elements

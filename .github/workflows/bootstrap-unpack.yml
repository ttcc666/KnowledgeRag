name: bootstrap-unpack

on:
  push:
    paths:
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and unpack project source
        shell: bash
        run: |
          cat bootstrap/part-* > /tmp/project.tar.gz.b64
          test "$(wc -c < /tmp/project.tar.gz.b64)" = "108488"
          base64 -d /tmp/project.tar.gz.b64 > /tmp/project.tar.gz
          echo "11925cf1beb81bfee1b8e9a5f30a1def8864cbc33b5ce047aaa17b0025c794fa  /tmp/project.tar.gz" | sha256sum -c -
          tar -tzf /tmp/project.tar.gz >/dev/null
          tar -xzf /tmp/project.tar.gz -C .
          rm -rf bootstrap
          rm -f project.tar.gz.b64 .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Initial commit: .NET 10 RAG platform with Clean Architecture and Shadcn Admin'
          git push

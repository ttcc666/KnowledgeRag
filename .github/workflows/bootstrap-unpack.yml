name: bootstrap-unpack

on:
  push:
    paths:
      - 'project.tar.gz.b64'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project source
        shell: bash
        run: |
          base64 -d project.tar.gz.b64 > /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz -C .
          rm -f project.tar.gz.b64 .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Initial commit: .NET 10 RAG platform with Clean Architecture and Shadcn Admin'
          git push
